steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/whisper-worker:$BUILD_ID"
      - "-t"
      - "gcr.io/$PROJECT_ID/whisper-worker:latest"
      - "-f"
      - "agents_runtime/whisper_worker/Dockerfile"
      - "agents_runtime/whisper_worker"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/whisper-worker:$BUILD_ID"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/whisper-worker:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "whisper-worker-test"
      - "--image=gcr.io/$PROJECT_ID/whisper-worker:$BUILD_ID"
      - "--region=us-central1"
      - "--cpu=4"
      - "--memory=8Gi"
      - "--gpu=1"
      - "--gpu-type=nvidia-l4"
      - "--max-retries=0"
      - "--parallelism=1"
      - "--task-timeout=120"
      - "--set-env-vars=ENVIRONMENT=test,LOG_LEVEL=INFO,WHISPER_MODEL=base,WHISPER_DEVICE=cuda,WHISPER_COMPUTE_TYPE=float16"
      - "--set-secrets=EVO_API_KEY=evolution-api-key:latest,AGENTS_RUNTIME_URL=agents-runtime-url:latest,AGENTS_RUNTIME_SA_TOKEN=agents-runtime-sa-token:latest"

images:
  - "gcr.io/$PROJECT_ID/whisper-worker:$BUILD_ID"
  - "gcr.io/$PROJECT_ID/whisper-worker:latest"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: "python:test"
    image: "python:3.12-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - "pip install -q -r requirements.txt && pytest -q tests/"

  - name: "docker:build"
    image: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/agents-runtime:$COMMIT_SHA", "."]

  - name: "docker:push"
    image: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/agents-runtime:$COMMIT_SHA"]

  - name: "gcloud:deploy"
    image: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "agents-runtime-test"
      - "--image=gcr.io/$PROJECT_ID/agents-runtime:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--cpu=2"
      - "--memory=2Gi"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--cpu-boost"
      - "--no-cpu-throttling"
      - "--port=8080"
      - "--timeout=120"
      - "--set-env-vars=ENVIRONMENT=test,LOG_LEVEL=INFO,AGENT_RELOAD_INTERVAL_SEC=120"
      - "--set-secrets=DEEPSEEK_API_KEY=deepseek-api-key:latest,NVIDIA_API_KEY=nvidia-api-key:latest,MINIMAX_API_KEY=minimax-api-key:latest,SERPER_API_KEY=serper-api-key:latest,GOOGLE_OAUTH_TOKEN=google-oauth-token:latest,AGENTS_RUNTIME_SA_TOKEN_SECRET=agents-runtime-sa-token:latest"

images:
  - "gcr.io/$PROJECT_ID/agents-runtime:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: "python:3.12-slim"
    entrypoint: "bash"
    dir: "agents_runtime"
    args:
      - "-c"
      - "pip install -q -r requirements.txt && pytest -q tests/"

  - name: "gcr.io/kaniko-project/executor:latest"
    args:
      - "--destination=gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
      - "--destination=gcr.io/$PROJECT_ID/agents-runtime:latest"
      - "--context=dir://agents_runtime"
      - "--cache=true"
      - "--cache-ttl=168h"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "agents-runtime-prod"
      - "--image=gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--cpu=2"
      - "--memory=2Gi"
      - "--min-instances=1"
      - "--max-instances=5"
      - "--cpu-boost"
      - "--no-cpu-throttling"
      - "--port=8080"
      - "--timeout=300"
      - "--set-env-vars=ENVIRONMENT=prod,LOG_LEVEL=INFO,AGENT_RELOAD_INTERVAL_SEC=120,GCP_PROJECT=coherence-ominichannel-fs,WHISPER_MODEL=base,WHISPER_DEVICE=cpu,WHISPER_COMPUTE_TYPE=int8,WHISPER_DOWNLOAD_ROOT=/app/whisper_models,RAG_EMBEDDING_MODEL=embo-01,RAG_EMBEDDING_DIM=1536,OAUTH_CLIENT_ID=894828119087-goo6lcl6vgm5bdq5qgafscb8qbr4ueet.apps.googleusercontent.com"
      - "--set-secrets=DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest,NVIDIA_API_KEY=NVIDIA_API_KEY:latest,MINIMAX_API_KEY=MINIMAX_API_KEY:latest,MINIMAX_GROUP_ID=minimax-group-id:latest,SERPER_API_KEY=serper-api-key:latest,GOOGLE_OAUTH_TOKEN=google-oauth-token:latest,AGENTS_RUNTIME_SA_TOKEN_SECRET=agents-runtime-sa-token:latest,GOOGLE_MAPS_API_KEY=google-maps-api-key:latest,YOUTUBE_API_KEY=youtube-api-key:latest,OAUTH_CLIENT_SECRET=oauth-client-secret:latest"

images:
  - "gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
  - "gcr.io/$PROJECT_ID/agents-runtime:latest"

options:
  logging: CLOUD_LOGGING_ONLY

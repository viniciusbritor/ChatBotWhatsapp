steps:
  - name: "python:3.12-slim"
    entrypoint: "bash"
    dir: "agents_runtime"
    args:
      - "-c"
      - "pip install -q -r requirements.txt && python -m py_compile proactive_worker/main.py && echo OK"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/proactive-worker:$BUILD_ID"
      - "-t"
      - "gcr.io/$PROJECT_ID/proactive-worker:latest"
      - "-f"
      - "agents_runtime/proactive_worker/Dockerfile"
      - "agents_runtime"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/proactive-worker:$BUILD_ID"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/proactive-worker:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "proactive-worker-test"
      - "--image=gcr.io/$PROJECT_ID/proactive-worker:$BUILD_ID"
      - "--region=us-central1"
      - "--cpu=1"
      - "--memory=1Gi"
      - "--max-retries=0"
      - "--parallelism=1"
      - "--task-timeout=300"
      - "--set-env-vars=ENVIRONMENT=test,LOG_LEVEL=INFO,GCP_PROJECT=coherence-ominichannel-fs"
      - "--set-secrets=DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest,GOOGLE_OAUTH_TOKEN=google-oauth-token:latest,WHATSAPP_AGENTE_URL=whatsapp-agente-url:latest,AGENTS_RUNTIME_SA_TOKEN=agents-runtime-sa-token:latest"

images:
  - "gcr.io/$PROJECT_ID/proactive-worker:$BUILD_ID"
  - "gcr.io/$PROJECT_ID/proactive-worker:latest"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: "python:3.12-slim"
    entrypoint: "bash"
    dir: "agents_runtime"
    args:
      - "-c"
      - "pip install -q -r requirements.txt && pip install -q -r requirements-dev.txt && ruff check core/ main.py orchestrator.py agent_loader.py tool_registry.py && mypy --no-incremental --explicit-package-bases --follow-imports=silent core && pytest -q tests/"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
      - "-t"
      - "gcr.io/$PROJECT_ID/agents-runtime:latest"
      - "agents_runtime"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/agents-runtime:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "agents-runtime-test"
      - "--image=gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--cpu=2"
      - "--memory=2Gi"
      - "--min-instances=1"
      - "--max-instances=3"
      - "--cpu-boost"
      - "--no-cpu-throttling"
      - "--port=8080"
      - "--timeout=300"
      - "--set-env-vars=ENVIRONMENT=test,LOG_LEVEL=INFO,AGENT_RELOAD_INTERVAL_SEC=120,AGENT_HEALTH_WINDOW_SEC=86400,PENDING_ACTION_TTL_SEC=300,RESPONSE_IDEMPOTENCY_TTL_SEC=86400,COMMIT_SHA=$BUILD_ID,GCP_PROJECT=coherence-ominichannel-fs,WHISPER_MODEL=base,WHISPER_DEVICE=cpu,WHISPER_COMPUTE_TYPE=int8,WHISPER_DOWNLOAD_ROOT=/app/whisper_models,AUDIO_MAX_BYTES=26214400,AUDIO_MAX_DURATION_SEC=300,AUDIO_DOWNLOAD_TIMEOUT_SEC=30,AUDIO_URL_ALLOWED_HOSTS=evolution.coherenceai.com.br,RAG_EMBEDDING_MODEL=text-embedding-3-small,RAG_EMBEDDING_DIM=1536,RAG_EMBEDDING_BASE_URL=https://api.openai.com/v1/embeddings,RAG_SCHEMA_VERSION=2,RAG_MEMORY_COLLECTION=conversation-memory-v2,RAG_PRIVATE_COLLECTION=agent-knowledge-v2,RAG_SHARED_COLLECTION=public-knowledge-v2,RAG_RETENTION_DAYS=90,OAUTH_CLIENT_ID=894828119087-goo6lcl6vgm5bdq5qgafscb8qbr4ueet.apps.googleusercontent.com"
      - "--set-secrets=DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest,NVIDIA_API_KEY=NVIDIA_API_KEY:latest,MINIMAX_API_KEY=MINIMAX_API_KEY:latest,MINIMAX_GROUP_ID=minimax-group-id:latest,SERPER_API_KEY=serper-api-key:latest,GOOGLE_OAUTH_TOKEN=google-oauth-token:latest,AGENTS_RUNTIME_SA_TOKEN_SECRET=agents-runtime-sa-token:latest,GOOGLE_MAPS_API_KEY=google-maps-api-key:latest,YOUTUBE_API_KEY=youtube-api-key:latest,OAUTH_CLIENT_SECRET=oauth-client-secret:latest,EVOLUTION_API_KEY=evolution-api-key:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest"

images:
  - "gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
  - "gcr.io/$PROJECT_ID/agents-runtime:latest"

options:
  logging: CLOUD_LOGGING_ONLY

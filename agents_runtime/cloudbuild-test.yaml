steps:
  - name: "python:3.12-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - "pip install -q -r requirements.txt && pytest -q tests/"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
      - "-t"
      - "gcr.io/$PROJECT_ID/agents-runtime:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/agents-runtime:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "agents-runtime-test"
      - "--image=gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--cpu=2"
      - "--memory=2Gi"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--cpu-boost"
      - "--no-cpu-throttling"
      - "--port=8080"
      - "--timeout=120"
      - "--set-env-vars=ENVIRONMENT=test,LOG_LEVEL=INFO,AGENT_RELOAD_INTERVAL_SEC=120,GCP_PROJECT=coherence-ominichannel-fs,WHISPER_MODEL=base,WHISPER_DEVICE=cpu,WHISPER_COMPUTE_TYPE=int8,WHISPER_DOWNLOAD_ROOT=/app/whisper_models"
      - "--set-secrets=DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest,NVIDIA_API_KEY=NVIDIA_API_KEY:latest,MINIMAX_API_KEY=MINIMAX_API_KEY:latest,SERPER_API_KEY=serper-api-key:latest,GOOGLE_OAUTH_TOKEN=google-oauth-token:latest,AGENTS_RUNTIME_SA_TOKEN_SECRET=agents-runtime-sa-token:latest"

images:
  - "gcr.io/$PROJECT_ID/agents-runtime:$BUILD_ID"
  - "gcr.io/$PROJECT_ID/agents-runtime:latest"

options:
  logging: CLOUD_LOGGING_ONLY
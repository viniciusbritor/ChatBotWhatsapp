steps:
  - name: "python:test"
    image: "python:3.12-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - "pip install -q -r requirements.txt && python -m py_compile ata_worker/main.py && echo OK"

  - name: "docker:build"
    image: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/ata-worker:$COMMIT_SHA", "-f", "ata_worker/Dockerfile", "."]

  - name: "docker:push"
    image: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/ata-worker:$COMMIT_SHA"]

  - name: "gcloud:run"
    image: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "ata-worker-test"
      - "--image=gcr.io/$PROJECT_ID/ata-worker:$COMMIT_SHA"
      - "--region=us-central1"
      - "--cpu=2"
      - "--memory=2Gi"
      - "--max-retries=0"
      - "--parallelism=1"
      - "--task-timeout=600"
      - "--set-env-vars=ENVIRONMENT=test,LOG_LEVEL=INFO,GCP_PROJECT=coherence-ominichannel-fs"
      - "--set-secrets=DEEPSEEK_API_KEY=deepseek-api-key:latest,GOOGLE_OAUTH_TOKEN=google-oauth-token:latest"

images:
  - "gcr.io/$PROJECT_ID/ata-worker:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY